<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>ServiceMaster by Singer – Daily Time & Job Log</title>

<style>
:root{
  --sm-yellow:#FFEE50; --ink:#111; --muted:#666; --bg:#f7f7f7;
  --card:#fff; --field:#D9E2FF; --border:#d7d7d7; --radius:14px;
}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink)}
.wrap{max-width:1100px;margin:auto;padding:14px}
.bar{background:var(--sm-yellow);border-radius:var(--radius);padding:14px 16px;font-weight:800;font-size:18px}
.actions{display:flex;gap:10px;margin-bottom:10px}
button{flex:1;border:1px solid var(--border);padding:12px;border-radius:12px;font-weight:700}
.primary{background:#111;color:#fff}
.card{background:#fff;border:1px solid var(--border);border-radius:14px;padding:14px;margin-top:12px}
.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:10px}
.field label{font-size:12px;font-weight:800;color:var(--muted)}
.field input,.field select{width:100%;padding:14px;font-size:16px;border-radius:10px;border:1px solid #bfc7e6;background:var(--field)}
.col-3{grid-column:span 3}
.col-4{grid-column:span 4}
.col-6{grid-column:span 6}
.col-12{grid-column:span 12}

@media(max-width:800px){
  .col-3,.col-4{grid-column:span 6}
  .col-6,.col-12{grid-column:span 12}
}

/* TABLE (desktop only) */
.tableWrap{overflow:auto;border:1px solid var(--border);border-radius:12px}
table{width:100%;min-width:980px;border-collapse:collapse}
th,td{padding:8px;border-bottom:1px solid #eee}
th{background:#eee;font-size:12px;text-align:left}
.cellInput{width:100%;padding:10px;border-radius:10px;border:1px solid #bfc7e6;background:var(--field)}

/* MOBILE ROW CARDS */
@media(max-width:700px){
  .tableWrap{display:none}
  #mobileRows{display:block}
}
#mobileRows{display:none}
.rowCard{border:1px solid var(--border);border-radius:14px;padding:12px;margin-bottom:12px}
.rowBadge{font-weight:800;font-size:12px;margin-bottom:8px}
.rowGrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.full{grid-column:1/-1}

/* Signature */
.sigPad{width:100%;height:120px;border:2px dashed #bfc7e6;border-radius:12px;touch-action:none}

/* Print */
@media print{
.actions{display:none}
}
</style>
</head>

<body>
<div class="wrap">

<div class="actions">
  <button class="primary" onclick="window.print()">Save as PDF (iPhone-safe)</button>
  <button onclick="location.reload()">Clear Form</button>
</div>

<div class="bar">ServiceMaster by Singer – Daily Time & Job Log</div>

<div class="card grid">
  <div class="field col-3"><label>Vendor</label><input></div>
  <div class="field col-3"><label>Driver Name</label><input></div>
  <div class="field col-3"><label>Residential / Commercial</label>
    <select><option></option><option>Residential</option><option>Commercial</option></select>
  </div>
  <div class="field col-3"><label>Date</label><input type="date"></div>
  <div class="field col-4"><label>Workers Name</label><input></div>
  <div class="field col-4"><label>Start Mileage</label><input type="number"></div>
  <div class="field col-4"><label>End Mileage</label><input type="number"></div>
</div>

<div class="card">
  <div class="tableWrap">
    <table>
      <thead><tr><th>#</th><th>Time In</th><th>Break</th><th>Time Out</th><th>Total</th><th>Job</th><th>Address</th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </div>
  <div id="mobileRows"></div>
</div>

<div class="card grid">
  <div class="field col-4"><label>Lead Print Name</label><input></div>
  <div class="field col-6">
    <label>Lead Signature</label>
    <canvas class="sigPad" id="sig"></canvas>
  </div>
  <div class="field col-2"><label>Date</label><input type="date"></div>
</div>

</div>

<script>
const rows=13,tbody=document.getElementById("rows"),mob=document.getElementById("mobileRows");
for(let i=1;i<=rows;i++){
  const r=document.createElement("tr");
  r.innerHTML=`<td>${i}</td>`+"<td><input class='cellInput' type='time'></td>".repeat(2)+
  "<td><input class='cellInput' type='time'></td>"+
  "<td><input class='cellInput' readonly></td>"+
  "<td><input class='cellInput'></td><td><input class='cellInput'></td>";
  tbody.appendChild(r);

  const c=document.createElement("div");
  c.className="rowCard";
  c.innerHTML=`<div class='rowBadge'>Row ${i}</div>
  <div class='rowGrid'>
    <input type=time class=cellInput>
    <input type=time class=cellInput>
    <input type=number class=cellInput placeholder='Break'>
    <input class=cellInput readonly placeholder='Total'>
    <input class='cellInput full' placeholder='Job'>
    <input class='cellInput full' placeholder='Address'>
  </div>`;
  mob.appendChild(c);
}

// signature
const canvas=document.getElementById("sig"),ctx=canvas.getContext("2d");
let d=false;function size(){canvas.width=canvas.offsetWidth;canvas.height=canvas.offsetHeight}
size();
canvas.addEventListener("touchstart",e=>{d=true;ctx.beginPath();ctx.moveTo(e.touches[0].clientX-canvas.offsetLeft,e.touches[0].clientY-canvas.offsetTop)});
canvas.addEventListener("touchmove",e=>{if(!d)return;ctx.lineTo(e.touches[0].clientX-canvas.offsetLeft,e.touches[0].clientY-canvas.offsetTop);ctx.stroke()});
canvas.addEventListener("touchend",()=>d=false);
</script>
</body>
</html>
